name: CI — Saúde em Movimento

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Typecheck, Test & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate --schema=packages/frontend/prisma/schema.prisma

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Testes
        run: npm run test --workspaces --if-present
        env:
          NODE_ENV: test
          KEK_HEX: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
          JWT_SECRET: test_secret_that_is_at_least_64_characters_long_for_ci_pipeline_testing_only
          DATABASE_URL: "file:./test.db"

      - name: Audit de Segurança
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Gerar SBOM
        run: npx -y @cyclonedx/cyclonedx-npm --output-file sbom.json
        continue-on-error: true

      - name: Upload SBOM
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
